<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Veil dApp — SEP-43 Reference</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 3rem auto; padding: 0 1rem; color: #1e293b; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #475569; font-size: 0.95rem; }
    pre { background: #0f172a; color: #f8fafc; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    button { padding: .6rem 1.1rem; cursor: pointer; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; font-weight: 500; font-size: 0.88rem; }
    button:hover:not(:disabled) { background: #f8fafc; border-color: #94a3b8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 1rem; font-size: .9rem; font-weight: 600; color: #2563eb; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <h1>Veil dApp — SEP-43 Standard Reference</h1>
  <p>
    This reference dApp drives the Veil wallet entirely through the
    <strong>SEP-0043 Standard Web Wallet API</strong> (<code>window.stellar.veil</code>),
    requiring zero custom adapter code.
  </p>

  <div class="card">
    <div class="btn-group">
      <button id="btn-connect">1. Connect (getAddress & getNetwork)</button>
      <button id="btn-sign-tx" disabled>2. Sign Transaction</button>
      <button id="btn-sign-auth" disabled>3. Sign Auth Entry</button>
      <button id="btn-sign-msg" disabled>4. Sign Message</button>
    </div>
    <p id="status">Status: Disconnected</p>
  </div>

  <h3>Output Log</h3>
  <pre id="output">No actions performed yet.</pre>

  <script src="app.js"></script>
</body>
</html>
