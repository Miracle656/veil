[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.4"

[dev-dependencies]
soroban-sdk = { version = "27.0.4", features = ["testutils"] }
p256 = { version = "0.13", features = ["ecdsa", "std"] }
sha2 = { version = "0.11" }
