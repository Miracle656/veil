[package]
name = "invisible-wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
arbitrary = { version = "=1.3.2", features = ["derive"] }
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
p256 = { version = "0.13", features = ["ecdsa", "std"] }
sha2 = { version = "0.11" }
