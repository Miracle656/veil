[package]
name = "invisible-wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "26.0.1"

[dev-dependencies]
soroban-sdk = { version = "26.0.1", features = ["testutils"] }
p256 = { version = "0.13", features = ["ecdsa", "std"] }
sha2 = { version = "0.11" }
