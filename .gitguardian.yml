# GitGuardian configuration
# Allowlist for testnet public values (NEXT_PUBLIC_* are browser-exposed constants)

matches:
  - name: Svelte example network config
    # `examples/sveltekit/src/lib/network.ts` assigns a `*passphrase`
    # identifier straight from the SDK constants, which the generic-password
    # detector reads as a hardcoded credential. The file already carries an
    # inline `gitguardian:ignore` annotation and still trips the check, so the
    # false positive is allowlisted here instead. The pattern is deliberately
    # blank and the scope is deliberately one demo config file: there is no
    # credential anywhere in it, only `Networks.PUBLIC`/`Networks.TESTNET`.
    match: '.*'
    reason: Demo app wired to the public Stellar network; no literal secret
    ignore_on:
      - path: examples/sveltekit/src/lib/network.ts
  - name: Testnet Contract ID
    match: CAUK4MWO3TTFM6PLURSH2GPK3AB747SZGABKTCVLKCU7W2MGKHKP35GA
    reason: Public testnet contract address (NEXT_PUBLIC_FACTORY_CONTRACT_ID)
    ignore_on:
      - path: .github/workflows/ci.yml
  - name: Pinned SPP testnet contract IDs
    match: '[CG][A-Z2-7]{55}'
    reason: >-
      Public testnet Soroban contract addresses pinned from
      NethermindEth/stellar-private-payments deployments.json at commit
      91ba67d659cb50a66ecba7ba42e27f8e686117f4 (V131 privacy config). They are
      deployed contracts, not credentials, and cannot be rotated.
    ignore_on:
      - path: frontend/wallet/lib/privacy/**
      - path: frontend/mobile/lib/privacy/**
