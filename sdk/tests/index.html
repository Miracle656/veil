<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veil SDK Browser Matrix Test</title>
</head>
<body>
  <h1>Veil SDK Browser Matrix Test</h1>
  <script type="module">
    import { Buffer } from 'buffer';
    window.Buffer = Buffer;
    // Expose a promise so Playwright waits for the SDK module to finish loading
    // before attempting to construct the wallet.
    window.__walletReady = import('../src/vanilla.ts').then(({ InvisibleWallet }) => {
      window.InvisibleWallet = InvisibleWallet;
      return InvisibleWallet;
    });
  </script>
</body>
</html>
