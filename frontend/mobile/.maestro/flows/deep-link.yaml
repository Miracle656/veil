appId: xyz.veil.wallet
name: Deep links
tags:
  - core
  - deeplink
env:
  RECIPIENT: "GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF"
---
# On-device counterpart to the unit tests in lib/__tests__/deepLinks.test.ts:
# those prove the resolver returns the right route, this proves the app actually
# lands there from both launch paths.
- runFlow: ../subflows/launch-fresh.yaml

# ── Warm resume ───────────────────────────────────────────────────────────────
# App already running and sitting on the home screen.
- openLink: "veil://pay?to=${RECIPIENT}&amount=7.25"
- assertVisible:
    id: "send-screen"
- assertVisible: ${RECIPIENT}
- assertVisible: "7.25"

- openLink: "veil://receive"
- assertVisible:
    id: "receive-screen"

# ── Cold start ────────────────────────────────────────────────────────────────
# Same links, but the process is dead when they arrive.
- stopApp
- openLink: "veil://pay?to=${RECIPIENT}&amount=7.25"
- assertVisible:
    id: "send-screen"
- assertVisible: ${RECIPIENT}
- assertVisible: "7.25"

- stopApp
- openLink: "veil://create-wallet"
- assertVisible:
    id: "create-wallet-screen"

# ── SEP-7 payment request ─────────────────────────────────────────────────────
# `web+stellar:pay` resolves onto the same send form (backlog #38 owns the
# validation of the URI itself).
- stopApp
- openLink: "web+stellar:pay?destination=${RECIPIENT}&amount=3.5"
- assertVisible:
    id: "send-screen"
- assertVisible: ${RECIPIENT}
- assertVisible: "3.5"

# ── Unrecognised links fall back home ─────────────────────────────────────────
# An unknown path must not leave the app on a blank or wrong screen.
- stopApp
- openLink: "veil://not-a-real-screen"
- assertVisible:
    id: "home-screen"
- assertNotVisible:
    id: "send-screen"
