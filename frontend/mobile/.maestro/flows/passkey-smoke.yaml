appId: xyz.veil.wallet
name: Passkey smoke (real device)
tags:
  - device
  - passkey
---
# Real-device smoke test. Excluded from the default run by `excludeTags` in
# config.yaml, because the platform biometric prompt cannot be satisfied on a
# stock emulator or simulator — there is no enrolled credential to match, and
# the prompt either never appears or cannot be dismissed.
#
# Run it against a device with a screen lock set and Face ID / fingerprint
# enrolled:
#
#   maestro test --include-tags device .maestro     # or: npm run e2e:device
#
# Maestro cannot press a physical fingerprint sensor. On the iOS simulator the
# "Matching Touch ID" menu item stands in; on a real device the operator
# authenticates by hand while the flow waits. Everything before and after that
# moment is asserted automatically, so this catches the two failures that
# actually happen in the field: the prompt never being raised, and the app not
# recovering after it is answered.
- runFlow: ../subflows/launch-fresh.yaml

- tapOn:
    id: "welcome-get-started-button"
- extendedWaitUntil:
    visible:
      id: "create-wallet-screen"
    timeout: 20000

- tapOn:
    id: "create-wallet-button"

# The system credential sheet is drawn by the OS, so it is matched by its text
# rather than a testID, and it is optional: once registration is real
# (backlog #25) the prompt is mandatory here, but the assertion must not fail
# the flow against a build that still stubs it out.
- extendedWaitUntil:
    visible:
      text: "(?i)(face id|touch id|fingerprint|passkey|biometric)"
    timeout: 20000
    optional: true

# The operator authenticates. The generous timeout is the human in the loop.
- extendedWaitUntil:
    visible:
      id: "create-wallet-success"
    timeout: 60000

- tapOn:
    id: "create-wallet-continue-button"

# Relaunch cold. Once the credential is persisted this is where the
# unlock-with-passkey assertion goes — a passkey that only works in the session
# that created it is the failure this smoke test exists to catch. Until then the
# entry router lands back on create-wallet, which at least proves the app
# restarts cleanly after the prompt.
- stopApp
- launchApp
- runFlow: ../subflows/dismiss-offline.yaml
- extendedWaitUntil:
    visible:
      id: "create-wallet-screen"
    timeout: 30000
