appId: xyz.veil.wallet
name: Receive
tags:
  - core
  - receive
---
# Covers the receive path: an address the payer can act on, a SEP-7 QR built
# from it, and the ways to hand it over.
- runFlow: ../subflows/launch-fresh.yaml

- openLink: "veil://receive"
- extendedWaitUntil:
    visible:
      id: "receive-screen"
    timeout: 20000
- assertVisible:
    id: "receive-address"
# A wiped install has no stored wallet, so the card shows the fallback classic
# (G) preview and addresses itself to ordinary senders rather than the
# contract-address variant a smart wallet gets.
- assertVisible: "Use this for most senders & exchanges"

# Copy writes to the clipboard and reports it. The clipboard itself is not
# readable from a flow, so the confirmation is the observable part.
- tapOn:
    id: "receive-copy"
- assertVisible: "Copied"

# Share opens the system sheet, which is OS UI outside the app. Asserting the
# tile exists and is tappable is as far as a flow can go without depending on
# a specific launcher's share dialog. Save QR likewise hands off to the system
# share sheet, so its tile presence is the assertion too.
- assertVisible:
    id: "receive-share"
- assertVisible:
    id: "receive-save"

# The screen survives leaving and coming back — the QR and address are rebuilt,
# not cached into a blank state. Send/Receive are no longer tabs, so the
# round-trip goes out through the back gesture and back in through the link.
- back
- assertVisible:
    id: "welcome-screen"
- openLink: "veil://receive"
- extendedWaitUntil:
    visible:
      id: "receive-address"
    timeout: 20000

# A requested amount arrives as a query parameter on the link. The screen does
# not render it yet (it builds a destination-only SEP-7 URI), so this asserts
# the routing only: the link must not be dropped or land somewhere else.
- stopApp
- openLink: "veil://receive?amount=42&asset=XLM"
- extendedWaitUntil:
    visible:
      id: "receive-screen"
    timeout: 30000
- assertVisible:
    id: "receive-address"
