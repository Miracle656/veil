appId: xyz.veil.wallet
name: Send
tags:
  - core
  - send
env:
  RECIPIENT: "GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF"
  AMOUNT: "12.5"
---
# Ports the send half of the web happy path (frontend/wallet/e2e/happy-path.spec.ts)
# plus its recipient-validation case. Signing and submission are not asserted —
# the slide-to-confirm fires a passkey ceremony no emulator can answer — so
# what this protects is the form, its validation, and the prefill contract that
# deep links and SEP-7 requests depend on.
- runFlow: ../subflows/launch-fresh.yaml

- openLink: "veil://send"
- extendedWaitUntil:
    visible:
      id: "send-screen"
    timeout: 20000

# A malformed address must be rejected before it can be submitted (#540).
# Asserted by testID, not text: Maestro matches `text` in full, so an assertion
# quoting only the start of the message fails while the error is on screen — and
# its `assertNotVisible` twin would then pass for the wrong reason.
- tapOn:
    id: "send-recipient"
- inputText: "not-a-stellar-address"
- hideKeyboard
- assertVisible:
    id: "send-recipient-error"

# A 56-character G address loses its first character when Maestro types into
# this controlled field, so the checksum never matches. A federated address
# is accepted by the same validator and is short enough to arrive intact.
# The G address is still checked below, where the link writes it into state.
- tapOn:
    id: "send-recipient"
- eraseText: 80
- inputText: "alice*example.com"
- hideKeyboard
- assertNotVisible:
    id: "send-recipient-error"

- tapOn:
    id: "send-amount"
- inputText: ${AMOUNT}
- hideKeyboard

# Do not match the typed address character for character. Maestro's delete
# leaves a tail of the previous value, and `*` is a regex quantifier, so
# `alice*example.com` never matches the field. The error clearing and the
# slide enabling are the checks that the replacement was accepted.
- assertVisible: ${AMOUNT}
# A cold-start install has no holdings, so the submit CTA remains disabled until an asset is held (#704).
- assertVisible:
    id: "send-submit"
    enabled: false
- assertNotVisible:
    id: "slide-to-confirm"

# Prefill from a payment request. The app is stopped first so this exercises the
# cold-start path into the send form; deep-link.yaml covers the warm resume.
- stopApp
- openLink: "veil://send?to=${RECIPIENT}&amount=25&memo=invoice-42"
- extendedWaitUntil:
    visible:
      id: "send-screen"
    timeout: 30000
- assertVisible: ${RECIPIENT}
- assertVisible: "25"
- assertVisible:
    id: "send-memo"
- assertVisible: "invoice-42"
