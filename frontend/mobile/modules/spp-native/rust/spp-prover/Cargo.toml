[package]
name = "spp-prover"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SPP note-format prover for the Veil mobile wallet (Android, via uniffi)"

[lib]
name = "spp_prover"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Keep the proving implementation and circuit ownership in upstream SPP.
# This commit is also the source of the circuit lockfile used by the native SDK.
stellar-private-payments = { git = "https://github.com/NethermindEth/stellar-private-payments.git", rev = "a407160de6636e58537402c483bcfd98d8c2ad7d", default-features = false }
sha2 = "0.10"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }

# build.rs calls uniffi::generate_scaffolding, which lives behind the `build`
# feature. Build scripts have their own dependency graph — listing uniffi only
# under [dependencies] leaves build.rs unable to resolve it (E0433).
[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]
