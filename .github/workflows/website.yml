name: Website

# Path-filtered build gate for the public landing site (frontend/website).
# Runs only when website sources, its lockfile, or this workflow change, so
# unrelated PRs skip the Node + Next cost. Dependabot's npm PRs for
# /frontend/website touch the lockfile, so they are gated too (#1407).
#
# No environment variables are needed: the site's canonical address comes from
# SITE_URL in lib/site.ts, which defaults to the production domain. Do not set
# NEXT_PUBLIC_SITE_URL here, and never point it at a preview deployment.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Website — typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/website
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/website/package-lock.json

      # path/key are GITHUB_WORKSPACE-relative (hashFiles and actions/* resolve
      # against the workspace root, not the job working-directory).
      - name: Cache Next.js build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/frontend/website/.next
          key: ${{ runner.os }}-website-next-${{ hashFiles('frontend/website/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-website-next-

      # npm ci only: it fails if package.json and the lockfile disagree,
      # which is exactly what a broken dependency bump looks like.
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build website
        run: npm run build
