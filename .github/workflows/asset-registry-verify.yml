name: Asset Registry Online Verification

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      warn_only:
        description: 'Run in warn-only mode (do not fail job)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  verify-assets-live:
    name: Verify Asset Registry Against Live Network
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install wallet dependencies for SDK
        working-directory: frontend/wallet
        run: npm ci

      - name: Run live asset verification
        id: live-verify
        run: |
          FLAGS=""
          if [ "${{ inputs.warn_only }}" = "true" ]; then
            FLAGS="--warn-only"
          fi
          node scripts/verify-assets-online.mjs $FLAGS --diff-file diff.txt 2>&1 | tee summary.txt
        shell: bash

      - name: Publish Step Summary
        if: always()
        run: |
          echo "## Asset Registry Live Verification Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f summary.txt ]; then
            cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Open Alert Issue on Scheduled Failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f diff.txt ]; then
            gh issue create \
              --title "[ALERT] Asset registry live verification failed against network" \
              --body-file diff.txt \
              --label "area:ci,epic:usdt0"
          fi
        shell: bash
