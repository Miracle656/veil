name: Fuzz — weekly cargo-fuzz run

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:      # Allow manual trigger

concurrency:
  group: scheduled-failure-weekly-fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_check_auth, fuzz_webauthn]
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: contracts

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run ${{ matrix.target }} (60 s)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60
        working-directory: contracts/fuzz

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: contracts/fuzz/artifacts/${{ matrix.target }}/

  report:
    name: Report scheduled fuzz result
    needs: fuzz
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create or update scheduled failure issue
        uses: ./.github/actions/scheduled-failure-issue
        with:
          key: weekly-fuzz
          status: ${{ needs.fuzz.result }}
          title-prefix: Weekly cargo-fuzz run failed
          labels: bug,fuzz
          what-to-check: |
            - Reproduce locally with the seed or corpus path shown in the log.
            - Check for and preserve a new crash input in `contracts/fuzz/artifacts/`.
            - Confirm whether the failure is deterministic and identify the affected target.