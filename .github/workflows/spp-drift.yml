name: SPP Config Drift Check

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      warn_only:
        description: 'Run in warn-only mode (do not fail job on drift)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/check-spp-drift.mjs'
      - 'frontend/wallet/lib/privacy/**'
      - '.github/workflows/spp-drift.yml'

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    name: Check SPP Upstream Config Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run SPP drift check
        id: drift-check
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.warn_only }}" = "true" ]; then
            FLAGS="--warn-only"
          fi
          node scripts/check-spp-drift.mjs $FLAGS --diff-file diff.txt 2>&1 | tee summary.txt
        shell: bash

      - name: Publish Step Summary
        if: always()
        run: |
          echo "## Stellar Private Payments (SPP) Drift Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f summary.txt ]; then
            cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Open Alert Issue on Scheduled Drift
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f diff.txt ]; then
            gh issue create \
              --title "[ALERT] Pinned SPP configuration drifted from upstream" \
              --body-file diff.txt \
              --label "area:ci,epic:privacy"
          fi
        shell: bash
