name: SPP config drift check

# Scheduled check to notice when Nethermind redeploys SPP and pinned testnet
# contract IDs drift (V207 — Issue #796).
#
# Runs on a daily schedule, not on the push path, so third-party GitHub / raw
# content downtime never blocks contributors' unrelated PRs.
#
# When drift is detected on the scheduled run, opens an issue naming the changed
# keys and old/new values.

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      warn_only:
        description: 'Report without failing the job'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/check-spp-drift.mjs'
      - 'frontend/wallet/lib/privacy/drift.ts'
      - 'frontend/wallet/lib/privacy/__tests__/drift.test.ts'
      - '.github/workflows/spp-drift.yml'

concurrency:
  group: spp-drift
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    name: Check SPP deployment drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run drift check
        id: check
        run: |
          node scripts/check-spp-drift.mjs \
            ${{ (github.event_name == 'pull_request' || inputs.warn_only) && '--warn-only' || '' }} \
            | tee drift.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish result to step summary
        if: always()
        run: |
          cat drift.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "No drift report generated" >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue on drift
        if: failure() && steps.check.outputs.status == 'drift' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Notice: SPP testnet deployment config has drifted from upstream" \
            --body "$(cat drift.txt)" \
            --label "area:ci,epic:privacy"
