name: SPP Config Drift Check

# Two checks, both in frontend/wallet/lib/privacy/drift.ts and both run through jest
# (__tests__/drift.live.test.ts); drift.test.ts covers that same code, so what runs here is what is tested.
#
#   1. Addresses - does the config pinned in lib/privacy/config.ts match upstream's deployments.json?
#   2. SDK - is the newest published `stellar-private-payments` older than the circuit keys the
#      deployed verifiers were built from?
#
# The second exists because the first went green through a month in which privacy could not have
# worked: a Groth16 proof is made with a proving key and checked against a verifying key, the two are
# generated together from one circuit, and npm lagged the redeploy by 22 commits. Correct addresses
# do not mean a proof would be accepted.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      warn_only:
        description: 'Run in warn-only mode (do not fail job on drift)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'frontend/wallet/lib/privacy/**'
      - '.github/workflows/spp-drift.yml'

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    name: Check SPP Upstream Config Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install wallet dependencies
        working-directory: frontend/wallet
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Run SPP drift check
        id: drift-check
        working-directory: frontend/wallet
        env:
          SPP_DRIFT_LIVE: '1'
          SPP_DRIFT_REPORT: ${{ github.workspace }}/diff.txt
          SPP_SDK_REPORT: ${{ github.workspace }}/sdk.txt
          SPP_DRIFT_WARN_ONLY: ${{ (github.event_name == 'pull_request' || inputs.warn_only) && '1' || '0' }}
        run: |
          npx jest lib/privacy/__tests__/drift.live.test.ts 2>&1 | tee "$GITHUB_WORKSPACE/summary.txt"
        shell: bash

      - name: Publish Step Summary
        if: always()
        run: |
          echo "## Stellar Private Payments (SPP) Drift Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f summary.txt ]; then
            cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      - name: Open or update alert issue on scheduled drift
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A report file is only written when that specific finding occurred. Without either, the
          # job failed for another reason (upstream unreachable, say), which is not drift.
          if [ ! -f diff.txt ] && [ ! -f sdk.txt ]; then
            echo "No drift report was produced; not filing an issue."
            exit 0
          fi

          # Separate issues: the address drift is ours to fix in one file, the stale SDK is upstream's
          # to republish. Filing them together would bury a fix we can make under one we cannot.
          file_or_comment() {
            title="$1"
            body="$2"
            # One open issue at a time per finding: something that takes days to resolve must not
            # file a new issue every morning.
            existing=$(gh issue list --state open --label "epic:privacy" \
              --search "$title in:title" --json number --jq '.[0].number // empty')
            if [ -z "$existing" ]; then
              gh issue create --title "[ALERT] $title" --body-file "$body" --label "area:ci,epic:privacy"
            else
              gh issue comment "$existing" --body-file "$body"
            fi
          }

          if [ -f diff.txt ]; then
            file_or_comment "Pinned SPP configuration drifted from upstream" diff.txt
          fi
          if [ -f sdk.txt ]; then
            file_or_comment "Published SPP SDK is older than the deployed circuits" sdk.txt
          fi
        shell: bash
