name: Mobile E2E Tests

on:
  pull_request:
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/mobile-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/mobile/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maestro-android:
    name: Maestro — Android emulator
    runs-on: ubuntu-latest
    # Prebuild plus a Gradle release build dominates the runtime; the flows
    # themselves take a few minutes.
    timeout-minutes: 60

    defaults:
      run:
        working-directory: frontend/mobile

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # The action's default package list includes the legacy `tools` package,
      # which Google removed from the SDK repository — `sdkmanager tools` now
      # exits 1 ("Failed to find package 'tools'") and fails the job before
      # Gradle ever runs. platform-tools (adb, for the install step below) is
      # the only thing needed; license acceptance still happens so Gradle can
      # fetch the platforms/build-tools the prebuild project requires.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      # The spp-native module's Gradle graph compiles the Rust prover per ABI
      # with cargo-ndk and generates uniffi bindings from a host build. Without
      # a toolchain, gradle silently skips those tasks (by design, so bare
      # `gradle` runs work without Rust) and CI would never exercise the
      # module — the emulator would test the WASM fallback and pass. The
      # toolchain itself and the android targets come from dtolnay/rust-toolchain
      # (host compiler) and the module's postinstall hook (targets + cargo-ndk);
      # rust-cache keeps the prover's build artifacts between runs.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/mobile/modules/spp-native/rust

      - name: Install dependencies
        run: npm ci

      # ios/ and android/ are gitignored and generated on demand, so the native
      # project has to be produced before Gradle can build it.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # A debug APK is an expo-dev-client build, so it boots to the "Development
      # Build" launcher waiting for a Metro server instead of running the app —
      # every flow then fails on the cold-start `welcome-screen` assertion before
      # it starts. Release builds bundle the JS and skip the launcher (it only
      # auto-shows in debuggable builds), so the app comes up on its own UI, and
      # deep links resolve because the manifest intent filters are live rather
      # than behind the dev client. The template signs release with the debug
      # keystore, so the result is still installable with `adb install`.
      - name: Build release APK
        working-directory: frontend/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The `device`-tagged passkey smoke test is excluded by .maestro/config.yaml;
      # an emulator has no enrolled biometric credential to satisfy the prompt.
      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: frontend/mobile
          script: |
            # Gate on real device readiness before touching the app: adb
            # attached, and sys.boot_completed set. The runner usually waits
            # for boot itself, but a device that reports `offline` here makes
            # every later step fail with misleading in-app symptoms, so fail
            # loudly at the device layer instead.
            adb wait-for-device
            for i in $(seq 1 60); do bc=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); st=$(adb get-state 2>/dev/null || true); if [ "$bc" = "1" ] && [ "$st" = "device" ]; then echo "Emulator boot completed"; break; fi; echo "Waiting for emulator readiness ($i/60)"; sleep 2; done
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; then echo "Emulator did not finish booting" >&2; adb logcat -d -t 500 || true; exit 1; fi

            adb install -r android/app/build/outputs/apk/release/app-release.apk

            # The app pushes /offline whenever NetInfo reports no usable
            # connection, and a freshly booted emulator often has not finished
            # bringing its network up. The flows also dismiss the offline
            # screen defensively, but a wait that gives up silently turns into
            # five confusing flow failures, so make an unvalidated network a
            # loud job failure instead.
            #
            # Every loop stays on one line: the emulator runner hands this
            # whole block to a single `sh -c`, and a multi-line `for ... done`
            # there trips dash with "Syntax error: end of file unexpected
            # (expecting done)".
            net_ready=false; for i in $(seq 1 60); do if adb shell dumpsys connectivity 2>/dev/null | grep -q "VALIDATED"; then net_ready=true; echo "Emulator network validated"; break; fi; echo "Waiting for emulator network ($i/60)"; sleep 5; done; if [ "$net_ready" != "true" ]; then echo "Emulator network was not validated" >&2; adb shell dumpsys connectivity || true; adb shell dumpsys wifi || true; exit 1; fi

            maestro test .maestro --format junit --output maestro-report.xml

      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-report
          path: |
            frontend/mobile/maestro-report.xml
            ~/.maestro/tests/**
          if-no-files-found: ignore
