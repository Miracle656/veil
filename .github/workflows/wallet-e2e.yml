name: Wallet E2E Tests

on:
  pull_request:
    paths:
      - 'frontend/wallet/**'
      - 'sdk/**'
      - '.github/workflows/wallet-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/wallet/**'
      - 'sdk/**'

permissions:
  # The PR comment step posts a comment on a pull request. That needs
  # `pull-requests: write` even though the REST endpoint is /issues/{n}/comments;
  # `issues: write` alone fails at runtime with "Resource not accessible".
  contents: read
  issues: write
  pull-requests: write

jobs:
  e2e-tests:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend/wallet

    env:
      # Without a factory address `computeWalletAddress('')` throws
      # "invalid version byte. expected 16, got undefined" and every
      # wallet-creation test fails. Same public testnet address ci.yml uses.
      NEXT_PUBLIC_FACTORY_CONTRACT_ID: CAUK4MWO3TTFM6PLURSH2GPK3AB747SZGABKTCVLKCU7W2MGKHKP35GA

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/wallet/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Built here rather than by playwright's webServer so the build cost sits
      # outside the server-boot timeout; the config serves this build with
      # `next start` when CI is set.
      - name: Build wallet
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test --grep-invert @nightly
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: frontend/wallet/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/wallet/playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-screenshots
          path: frontend/wallet/test-results/**/*.png
          retention-days: 7

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: frontend/wallet/test-results/**/*.zip
          retention-days: 7

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const comment = `## ❌ E2E Tests Failed
            
            Playwright tests failed. Check the uploaded artifacts for:
            - Screenshots of failures
            - Trace files for debugging
            - Full test report
            
            [View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
