name: Memory Leak Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-leak:
    name: Heap Growth Test (10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend/wallet

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/wallet/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Playwright's webServer runs `next start` in CI, so it needs the
      # production bundle before the nightly browser test starts.
      - name: Build wallet production bundle
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run memory leak test
        run: npx playwright test --grep @nightly
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-leak-report
          path: frontend/wallet/playwright-report/
          retention-days: 30

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-leak-traces
          path: frontend/wallet/test-results/**/*.zip
          retention-days: 7
