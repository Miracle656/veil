name: Storybook

on:
  push:
    branches: [main]
    paths:
      - 'sdk/react/**'
      - 'sdk/package.json'
      - '.github/workflows/storybook.yml'
  pull_request:
    paths:
      - 'sdk/react/**'
      - 'sdk/package.json'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:

# The build job only reads; the deploy job declares the pages scope it needs.
permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci || { echo "::warning::npm ci failed; falling back to npm install"; npm install; }
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: sdk/react/storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only publish from the default branch; PRs just build to catch breakage.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Deploying to GitHub Pages needs the Pages deployment scopes.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
