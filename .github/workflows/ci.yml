name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  root-install:
    name: Repo root — install is clean (#670)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      # The repo root is its own small npm project (release tooling + the smoke
      # test's stellar-sdk), NOT an npm workspace. `npm ci` proves package.json
      # and package-lock.json agree; verify:lockfile then proves a plain
      # `npm install` reproduces the committed lockfile byte for byte.
      - run: npm ci
      - run: npm run verify:lockfile
      # Belt and braces, and the actual acceptance criterion for #670: a real
      # install on a fresh clone must leave `git status` clean. A hoisted root
      # install used to rewrite package-lock.json (947 -> 21,217 lines) and to
      # re-run workspace members' prepare scripts over their committed dist/.
      - run: npm install
      - name: Fail if the root install dirtied the working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::A root 'npm install' modified tracked files. See CONTRIBUTING.md and scripts/verify-root-lockfile.mjs."
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "Working tree clean after a root npm install."

  security-audit:
    name: Security Audit — cargo audit
    runs-on: ubuntu-latest
    permissions:
      # rustsec/audit-check posts results as a check run; the default read-only
      # GITHUB_TOKEN returned "Resource not accessible by integration".
      contents: read
      checks: write
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: contracts
          # RUSTSEC-2026-0009 (time <0.3.47, DoS via RFC 2822 parse recursion):
          # `time` is a host/dev-only dependency — it is NOT in the wasm32 build
          # tree (verified with `cargo tree -i time --target wasm32-unknown-unknown`),
          # so the parsing path is unreachable in the deployed contract. Patching
          # forward pulls time-macros, which raises the MSRV to Rust 1.88 and
          # breaks the pinned 1.85 reproducible build.
          ignore: RUSTSEC-2026-0009

  contracts:
    name: Rust contracts — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo build --all
      - run: cargo test -p invisible-wallet

  sdk:
    name: SDK — typecheck, test & size budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      # sdk/ is a standalone npm project with its own lockfile — the repo root
      # declares no workspaces, so npm installs everything into sdk/node_modules
      # where the jest config's <rootDir>/node_modules mappers expect it.
      # --legacy-peer-deps: sdk's own @types/react 18 vs @types/react-dom 19
      # (pulled in by Storybook) peer set would otherwise ERESOLVE.
      - run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm test --if-present
      - name: Run Jest with coverage
        run: npx jest --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - name: Bundle size budget (size-limit)
        run: npm run size

  # SDK Browser Matrix — Playwright tests across browsers
  sdk-browser-matrix:
    name: SDK Browser Matrix — Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright (Chromium)
        run: npx playwright test --project=chromium --reporter=html
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/chromium
      - name: Run Playwright (Firefox)
        if: always()
        run: npx playwright test --project=firefox --reporter=html
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/firefox
      - name: Run Playwright (Webkit)
        if: always()
        run: npx playwright test --project=webkit --reporter=html
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/webkit
      - name: Upload Playwright Chromium report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: sdk/playwright-report/chromium
      - name: Upload Playwright Firefox report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-firefox
          path: sdk/playwright-report/firefox
      - name: Upload Playwright Webkit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit
          path: sdk/playwright-report/webkit

  wallet:
    name: Wallet frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/wallet
    # gitguardian:ignore=true — public testnet values (NEXT_PUBLIC_* are browser-exposed)
    env:
      NEXT_PUBLIC_NETWORK: testnet
      NEXT_PUBLIC_FACTORY_CONTRACT_ID: CAUK4MWO3TTFM6PLURSH2GPK3AB747SZGABKTCVLKCU7W2MGKHKP35GA
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
      NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/wallet/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Run Jest with coverage
        run: npx jest --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  agent:
    name: Agent — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/agent/package-lock.json
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build

  mobile:
    name: Mobile — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  lighthouse-ci:
    name: Wallet PWA — Lighthouse performance budget
    runs-on: ubuntu-latest
    needs: wallet
    defaults:
      run:
        working-directory: frontend/wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/wallet/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
        # gitguardian:ignore=true — public testnet values (NEXT_PUBLIC_* are browser-exposed)
        env:
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_FACTORY_CONTRACT_ID: CAUK4MWO3TTFM6PLURSH2GPK3AB747SZGABKTCVLKCU7W2MGKHKP35GA
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@latest

      - name: Start Next.js server
        run: npx next start -p 3000 &
        shell: bash

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Run Lighthouse CI
        run: lhci autorun

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'frontend/wallet/.lhci/results/lhci_summary.json';
            
            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf-8'));
              
              let comment = '📊 **Lighthouse Performance Audit Results**\n\n';
              comment += '| Category | Score | Threshold |\n';
              comment += '|----------|-------|----------|\n';
              comment += `| Performance | ${(results.scores.performance * 100).toFixed(0)}/100 | ≥ 80 |\n`;
              comment += `| Accessibility | ${(results.scores.accessibility * 100).toFixed(0)}/100 | ≥ 90 |\n`;
              comment += `| PWA | ${(results.scores.pwa * 100).toFixed(0)}/100 | ≥ 80 |\n`;
              comment += `| Best Practices | ${(results.scores['best-practices'] * 100).toFixed(0)}/100 | ≥ 90 |\n\n`;
              comment += `📈 [View full report](${results.reportUrl})\n`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
