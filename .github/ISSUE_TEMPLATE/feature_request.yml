name: Feature Request
description: Suggest a new feature or improvement for Veil
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the feature look like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about
    validations:
      required: false

  - type: checkboxes
    id: component
    attributes:
      label: Component
      options:
        - label: Wallet frontend
        - label: SDK
        - label: Contracts
        - label: Agent
        - label: Docs
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
