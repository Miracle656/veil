name: Bug Report
description: Report a bug in Veil (wallet, SDK, contracts, or agent)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Wallet frontend
        - SDK
        - Contracts
        - Agent
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Testnet
        - Mainnet
    validations:
      required: true

  - type: input
    id: browser-os
    attributes:
      label: Browser / OS
      placeholder: "e.g. Chrome 126 / macOS 14"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console errors, screenshots, or transaction hashes
    validations:
      required: false
